name: CI/CD Pipeline - Jitsi Meet & Jibri Recording Infrastructure

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ============================================================================
  # 1. Syntax Validation, Configuration & Schema Checks
  # ============================================================================
  validate-configuration:
    name: Validate Scripts & Configurations
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate Shell Scripts Syntax
        run: |
          echo "Checking shell scripts with bash -n..."
          bash -n check-environment.sh
          bash -n start-demo.sh
          bash -n test-recorder.sh
          bash -n simulate-host-disconnect.sh
          bash -n jitsi/gen-passwords.sh
          echo "✔ All shell scripts passed syntax checks."

      - name: Validate Custom JavaScript Configurations
        run: |
          echo "Checking custom configuration scripts with node --check..."
          node --check jitsi-config-templates/web/custom-config.js
          node --check jitsi-config-templates/web/custom-interface_config.js
          echo "✔ All custom JavaScript configurations passed syntax checks."

      - name: Validate Template Files Existence
        run: |
          echo "Verifying presence of Jibri PulseAudio and Web templates..."
          test -f jitsi-config-templates/jibri/pulse-daemon.conf
          test -f jitsi-config-templates/jibri/pulse-default.pa
          test -f jitsi-config-templates/web/custom-config.js
          test -f jitsi-config-templates/web/custom-interface_config.js
          echo "✔ All essential templates are present."

      - name: Validate Docker Compose Schema
        run: |
          echo "Validating Docker Compose YAML schemas..."
          cp jitsi/env.example jitsi/.env
          docker compose -f jitsi/docker-compose.yml -f jitsi/jibri.yml config > /dev/null
          echo "✔ Docker Compose configurations are valid."

  # ============================================================================
  # 2. Integration Smoke Test
  # ============================================================================
  smoke-test:
    name: Environment & Compose Smoke Test
    needs: validate-configuration
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Environment Audit Script
        run: |
          echo "Running check-environment.sh..."
          ./check-environment.sh

      - name: Verify Docker Compose Services Definition
        run: |
          cp jitsi/env.example jitsi/.env
          echo "Listing defined compose services:"
          docker compose -f jitsi/docker-compose.yml -f jitsi/jibri.yml config --services
          echo "✔ All Jitsi and Jibri services verified."
