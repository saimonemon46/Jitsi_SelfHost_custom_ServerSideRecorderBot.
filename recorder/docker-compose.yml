services:
  recorder:
    build:
      context: .
      dockerfile: Dockerfile
    image: jitsi-custom-recorder:latest
    container_name: jitsi-recorder-bot
    restart: unless-stopped
    # Use host network mode on Linux for seamless access to meet.localhost and JVB WebRTC UDP ports
    network_mode: host
    environment:
      - PORT=3000
      - RECORDER_API_KEY=${RECORDER_API_KEY:-local-dev-secret-key-123}
      - DISPLAY=:99
      - VIDEO_WIDTH=${VIDEO_WIDTH:-1920}
      - VIDEO_HEIGHT=${VIDEO_HEIGHT:-1080}
      - VIDEO_FPS=${VIDEO_FPS:-30}
      - VIDEO_BITRATE=${VIDEO_BITRATE:-4M}
      - AUDIO_BITRATE=${AUDIO_BITRATE:-128k}
      - SEGMENT_DURATION_SEC=${SEGMENT_DURATION_SEC:-30}
      - PULSE_SINK_NAME=jitsi_virtual_sink
      - RECORDINGS_DIR=/recordings
      - MIN_DISK_SPACE_MB=1024
      - BOT_DISPLAY_NAME=Course Recorder
    volumes:
      - ./recordings:/recordings:rw
      - ./logs:/app/logs:rw
    # Resource constraints to prevent recorder from consuming all host RAM/CPU (Phase 18)
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4096M
        reservations:
          cpus: '1.0'
          memory: 1024M
    shm_size: '2gb' # Generous shared memory for Chromium browser tabs
